<!DOCTYPE html>
<!-- LUV ME | index.html | v1.1.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Would you date me? 💜</title>
<meta name="theme-color" content="#7c4ddb">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="fmn">
    <g fill="#8db4ff" stroke="#3d1f73" stroke-width="1.5">
      <circle cx="8" cy="0" r="6.5"/><circle cx="2.5" cy="7.6" r="6.5"/><circle cx="-6.5" cy="4.7" r="6.5"/>
      <circle cx="-6.5" cy="-4.7" r="6.5"/><circle cx="2.5" cy="-7.6" r="6.5"/>
    </g>
    <circle r="3.6" fill="#ffe27a" stroke="#3d1f73" stroke-width="1.2"/>
  </g>
  <g id="flora">
    <g fill="none" stroke="#4d9a6a" stroke-width="3.5" stroke-linecap="round">
      <path d="M22 600C12 520 44 470 30 400S14 300 38 215"/>
      <path d="M62 600C72 540 52 500 66 440S80 360 62 300"/>
      <path d="M30 400C42 392 60 392 76 376"/>
      <path d="M20 330C14 320 10 308 12 296"/>
    </g>
    <g fill="#6fbf8b" stroke="#3d1f73" stroke-width="1.2">
      <ellipse cx="22" cy="470" rx="13" ry="5.5" transform="rotate(-30 22 470)"/>
      <ellipse cx="72" cy="505" rx="13" ry="5.5" transform="rotate(30 72 505)"/>
      <ellipse cx="50" cy="560" rx="12" ry="5" transform="rotate(-25 50 560)"/>
    </g>
    <use href="#fmn" transform="translate(38 215) scale(1.6)"/>
    <use href="#fmn" transform="translate(62 300) scale(1.4)"/>
    <use href="#fmn" transform="translate(76 376) scale(1.1)"/>
    <use href="#fmn" transform="translate(12 296) scale(.85)"/>
    <use href="#fmn" transform="translate(30 405)"/>
  </g>
</defs></svg>

<div id="bg" aria-hidden="true"></div>
<svg class="flora left" viewBox="0 0 100 600" aria-hidden="true"><use href="#flora"/></svg>
<svg class="flora right" viewBox="0 0 100 600" aria-hidden="true"><use href="#flora"/></svg>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="card">
  <svg class="mascot" id="mascot" viewBox="0 0 120 110" role="img" aria-label="A cute heart with a face">
    <path class="heart" d="M60 104C20 76 6 52 6 34 6 18 18 6 33 6c11 0 21 6 27 16C66 12 76 6 87 6c15 0 27 12 27 28 0 18-14 42-54 70z"/>
    <ellipse class="cheek" cx="30" cy="62" rx="9" ry="6"/><ellipse class="cheek" cx="90" cy="62" rx="9" ry="6"/>
    <circle class="eye" cx="44" cy="50" r="6"/><circle class="eye" cx="76" cy="50" r="6"/>
    <circle class="shine" cx="46" cy="48" r="2"/><circle class="shine" cx="78" cy="48" r="2"/>
    <path id="mouth" class="mouth" d="M50 66q10 10 20 0"/>
  </svg>

  <section id="ask">
    <p id="hello" class="hello"></p>
    <h1 id="question"></h1>
    <p id="hint" class="hint" aria-live="polite">&nbsp;</p>
    <div class="actions">
      <button id="yes" class="btn yes" type="button"></button>
      <span class="no-slot"><button id="no" class="btn no" type="button"></button></span>
    </div>
  </section>

  <section id="yay" hidden>
    <h2 id="yayTitle"></h2>
    <p id="yayText" class="hint"></p>
    <div id="dates" class="chips" role="radiogroup" aria-label="Pick our first date"></div>
    <a id="share" class="btn yes" href="https://t.me/Parhuyat" target="_blank" rel="noopener">Send my answer 💌</a>
    <p id="status" class="hint" aria-live="polite">&nbsp;</p>
  </section>
</main>

<footer class="sig">
  <img src="assets/logo.svg" alt="" width="28" height="28">
  <span>Made by Parhum for Rey - W/Love</span>
</footer>

<script src="js/config.js"></script>
<script src="js/confetti.js"></script>
<script src="js/main.js"></script>
</body>
</html>
